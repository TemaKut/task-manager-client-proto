syntax = "proto3";

package task_manager;

option go_package = "github.com/TemaKut/task-manager-client-proto/gen/go;taskmanager";

message Request {
  string id = 1;

  reserved 2 to 20;

  oneof data {
    UserRegisterRequest user_register = 21;
  }
}


message UserRegisterRequest {
  string name = 1;
  string last_name = 2;
}