syntax = "proto3";

package task_manager;

option go_package = "github.com/TemaKut/task-manager-client-proto/gen/go;taskmanager";

import "google/protobuf/timestamp.proto";

message ResponseError {
  string request_id = 1;
  google.protobuf.Timestamp server_time = 2;
  ResponseErrorType error_type = 3;
  string description = 4;
}


enum ResponseErrorType {
  RESPONSE_ERROR_TYPE_UNSPECIFIED = 0;
  RESPONSE_ERROR_TYPE_REQUEST_HAS_NO_ID = 1;
}

